<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>التحليل المالي والمقارنة الذكية</title>
<style>
:root{--bg:#f8fafc;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#059669;--blue:#2563eb;--red:#be123c;--warn:#b45309}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
body{padding:8px;padding-bottom:calc(85px + env(safe-area-inset-bottom,12px));display:flex;justify-content:center;align-items:flex-start}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{width:100%;max-width:540px;background:var(--card);border:1px solid #dbe3ee;border-radius:22px;box-shadow:0 12px 35px #0f172a12;display:flex;flex-direction:column}
.header{background:#0f172a;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;gap:8px;border-top-left-radius:21px;border-top-right-radius:21px}
.pill{font-size:10px;background:#1e293b;color:#cbd5e1;padding:5px 8px;border-radius:8px;white-space:nowrap}
.content{padding:14px;flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
label{display:block;color:#475569;font-size:12px;font-weight:700;margin-bottom:5px}
input,select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:var(--ink);outline:none;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.btn{border:0;border-radius:14px;padding:12px 10px;font-weight:800;font-size:13px;transition:all .2s ease;text-align:center;text-decoration:none;display:inline-block}
.btn-primary{background:linear-gradient(135deg,#059669,#047857);color:white}
.btn-soft{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.btn-green{background:#059669;color:white}
.btn-dark{background:#0f172a;color:white}
.btn-muted{background:#f1f5f9;color:#334155}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel{background:#ffffff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(15,23,42,0.03)}
.metric-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,0.02)}
.metric span{display:block;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:700}
.metric strong{display:block;font-size:15px;font-weight:800}
.good{color:#047857}.bad{color:#be123c}
.report{background:white;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 15px rgba(0,0,0,0.03)}
.report-head{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:14px;text-align:center;padding:16px 10px}
.report-head h2{font-size:16px;margin:0;font-weight:900}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;width:100%;background:#fff}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:11px;text-align:right}
th,td{padding:8px 4px;border-bottom:1px solid #eef2f7;border-left:1px solid #f1f5f9}
th{background:#f1f5f9;color:#334155;font-weight:800}
.total-column-head{background:#0f172a!important;color:#34d399!important}
.total-column-cell{background:#f0fdf4!important;font-weight:bold}
.nav-bottom{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(100% - 16px);max-width:540px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px;background:#0f172a;border-radius:20px;box-shadow:0 12px 30px rgba(0,0,0,0.4);z-index:30}
.nav-bottom .nav-btn{background:transparent;border:0;color:#94a3b8;padding:10px 2px;font-size:11px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;text-decoration:none}
.nav-bottom .nav-btn.active{background:#1e293b;color:#34d399}
.hint{font-size:11px;line-height:1.6;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:12px;padding:10px}
#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:200;background:#0f172a;color:white;padding:11px 16px;border-radius:14px;font-size:12px;display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">
<header class="header"><span>التحليل المالي والمقارنة 📊</span><a href="index.html" class="btn btn-soft" style="padding:4px 10px;font-size:11px">الرئيسية 🏠</a></header>
<main class="content stack">
  <div class="panel stack">
    <div class="row-between">
      <strong style="font-size:13px">🎛️ فلتر ونطاق التحليل</strong>
      <button type="button" class="btn btn-soft" style="padding:4px 10px;font-size:11px" onclick="renderFinancialComparison()">تحديث 🔄</button>
    </div>
    <div class="grid2">
      <div>
        <label>نطاق الدورات</label>
        <select id="compare-range-select" onchange="renderFinancialComparison()">
          <option value="current" selected>الدورة الحالية فقط 🎯</option>
          <option value="last3">آخر 3 دورات</option>
          <option value="last6">آخر 6 دورات</option>
          <option value="all">جميع الدورات المسجلة</option>
        </select>
      </div>
      <div>
        <label>نوع التحليل</label>
        <select id="compare-analysis-type" onchange="renderFinancialComparison()">
          <option value="all">كل الحركات (شامل)</option>
          <option value="personal">مصروفاتي الشخصية فقط</option>
          <option value="transfers">التحويلات الخارجية فقط</option>
          <option value="debts">الديون والتسويات فقط</option>
        </select>
      </div>
    </div>
  </div>

  <div class="metric-grid">
    <div class="metric"><span>إجمالي الدخل (النطاق)</span><strong id="kpi-total-income" class="good">0.000 د.ك</strong></div>
    <div class="metric"><span>إجمالي المصروف الشامل</span><strong id="kpi-total-expense" class="bad">0.000 د.ك</strong></div>
    <div class="metric"><span>معدل الصرف اليومي</span><strong id="kpi-daily-avg">0.000 د.ك/يوم</strong></div>
    <div class="metric"><span>مؤشر الأمان المالي ⏳</span><strong id="kpi-cash-runway" style="color:#2563eb">—</strong></div>
  </div>

  <div id="compare-capture-area" class="report">
    <div class="report-head"><h2>تقرير التحليل المالي والمقارنة الشاملة</h2><div id="compare-report-period" style="font-size:11px;color:#cbd5e1;margin-top:4px">—</div></div>
    <div id="compare-results" class="stack"></div>
  </div>

  <div class="grid2" style="margin-top:10px">
    <button type="button" onclick="exportCompareExcel()" class="btn btn-green">تصدير Excel 📗</button>
    <button type="button" onclick="shareCompareWhatsApp()" class="btn btn-green">مشاركة / واتساب 💬</button>
  </div>
</main>

<nav class="nav-bottom">
  <a href="index.html" class="nav-btn"><span>🏠</span><span>الرئيسية والإدخال</span></a>
  <a href="analytics.html" class="nav-btn active"><span>📊</span><span>صفحة التحليل</span></a>
</nav>
</div>
<div id="toast"></div>

<script>
const DB_NAME="PersonalFinanceDB",DB_VERSION=1,STORE_NAME="transactions";
let db=null;

function $(e){return document.getElementById(e)}
function showToast(e){const t=$("toast");t.textContent=e,t.style.display="block",setTimeout((()=>t.style.display="none"),3500)}
function money(e){return Number(e||0).toFixed(3)+" د.ك"}
function formatStrictISO(e,t,a){return`${String(e).padStart(4,"0")}-${String(t).padStart(2,"0")}-${String(a).padStart(2,"0")}`}
function todayISO(){const e=new Date;return formatStrictISO(e.getFullYear(),e.getMonth()+1,e.getDate())}
function fmtDate(e){if(!e)return"";const t=e.split("-");return 3===t.length?`${t[2]}/${t[1]}/${t[0]}`:e}

function openDB(){
  return db?Promise.resolve(db):new Promise(((e,t)=>{
    const a=indexedDB.open(DB_NAME,DB_VERSION);
    a.onsuccess=t=>{db=t.target.result;e(db)};
    a.onerror=e=>t(e.target.error)
  }))
}

async function allTransactions(){
  return db||await openDB(),new Promise(((e,t)=>{
    const a=db.transaction(STORE_NAME,"readonly").objectStore(STORE_NAME).getAll();
    a.onsuccess=()=>e(a.result);
    a.onerror=()=>t(a.error)
  }))
}

function realAmount(e){return e?"transfer"===e.type||"internal_transfer"===e.type?Number(e.totalKwd??e.amount)||0:Number(e.amount)||0:0}

function getAllSalaryCycles(e){
  const t=todayISO(),a=(e||[]).filter((e=>e&&e.date)),n=[...new Set(a.filter((e=>"income"===e.type&&e.isSalaryBase)).map((e=>e.date)).sort())],s=[];
  if(!n.length){
    const e=a.map((e=>e.date)).sort(),n=e.length?e[0]:"2026-01-01";
    return s.push({id:`cycle_${n}`,label:`الدورة الحالية (${fmtDate(n)} ← اليوم)`,start:n,end:t,isCurrent:!0,cycleIndex:1}),s
  }
  for(let e=0;e<n.length;e++){
    const a=n[e],r=e===n.length-1,o=r?t:n[e+1],l=e+1;
    s.push({id:`cycle_${a}`,label:r?`الدورة الحالية (${fmtDate(a)} ← اليوم)`:`دورة ${l}`,start:a,end:o,isCurrent:r,cycleIndex:l})
  }
  return s
}

async function renderFinancialComparison(){
  const e=await allTransactions(),t=getAllSalaryCycles(e);
  if(!t.length)return;
  const a=$("compare-analysis-type")?.value||"all";
  let o=0,l=0;
  t.forEach((t=>{
    o+=e.filter(tx=>tx.date>=t.start&&tx.date<=t.end&&("income"===tx.type||tx.debtType==="creditor")).reduce((s,x)=>s+realAmount(x),0);
    l+=e.filter(tx=>tx.date>=t.start&&tx.date<=t.end&&("expense"===tx.type||"transfer"===tx.type||tx.debtType==="debtor")).reduce((s,x)=>s+realAmount(x),0);
  }));
  $("kpi-total-income").textContent=money(o);
  $("kpi-total-expense").textContent=money(l);
  $("kpi-daily-avg").textContent=(l/30).toFixed(3)+" د.ك/يوم";

  let g=`<div class="table-wrap"><table><thead><tr><th>دورة الراتب</th><th>الدخل</th><th>الإنفاق</th><th>الصافي</th></tr></thead><tbody>`;
  t.forEach(c=>{
    const inc=e.filter(tx=>tx.date>=c.start&&tx.date<=c.end&&("income"===tx.type||tx.debtType==="creditor")).reduce((s,x)=>s+realAmount(x),0);
    const exp=e.filter(tx=>tx.date>=c.start&&tx.date<=c.end&&("expense"===tx.type||"transfer"===tx.type||tx.debtType==="debtor")).reduce((s,x)=>s+realAmount(x),0);
    const net=inc-exp;
    g+=`<tr><td>${c.label}</td><td class="good">${money(inc)}</td><td class="bad">${money(exp)}</td><td style="font-weight:bold">${money(net)}</td></tr>`;
  });
  g+="</tbody></table></div>";
  $("compare-results").innerHTML=g;
}

window.addEventListener("DOMContentLoaded",(async()=>{
  await openDB();
  await renderFinancialComparison();
}));
</script>
</body>
</html>
